name: Custom.Windows.Events.AllEventLogs
type: CLIENT_EVENT
sources:
  - query: |
      LET files = SELECT OSPath FROM glob(
        globs="C:/Windows/System32/winevt/Logs/*.evtx")

      SELECT * FROM foreach(
        row=files,
        async=TRUE,
        query={
          SELECT System.TimeCreated.SystemTime AS EventTime,
                 System.Channel AS Channel,
                 System.EventID.Value AS EventID,
                 System.Computer AS Computer,
                 EventData, UserData
          FROM watch_evtx(filename=OSPath)
        })