name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tarball
        run: |
          mkdir -p tarball
          tar -czf "tarball/${{ github.event.repository.name }}.tar.gz" \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.tgz' \
            --exclude='*.tar.bz2' \
            --exclude='*.tbz2' \
            --exclude='*.tar.xz' \
            --exclude='*.txz' \
            5_min_plans

      # Only on pushes to main; PRs (esp. from forks) have a read-only token
      - name: Commit tarball to repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tarball/
          git diff --cached --quiet || git commit -m "Update tarball [skip ci]"
          git push

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-tarball
          path: tarball/
