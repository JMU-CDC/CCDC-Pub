name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create tarball
        run: |
          # Build in a temp dir, then move into tarball/ so the archive can't include itself
          mkdir -p tarball
          tar -czf "$RUNNER_TEMP/${{ github.event.repository.name }}.tar.gz" \
            --exclude='.git' \
            --exclude='./tarball' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.tgz' \
            --exclude='*.tar.bz2' \
            --exclude='*.tbz2' \
            --exclude='*.tar.xz' \
            --exclude='*.txz' \
            .
          mv "$RUNNER_TEMP/${{ github.event.repository.name }}.tar.gz" tarball/

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-tarball
          path: tarball/
